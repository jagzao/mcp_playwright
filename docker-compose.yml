version: '3.8'

services:
  # MCP Playwright Automation (main service)
  mcp-playwright:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-playwright-automation
    environment:
      - NODE_ENV=production
      - HEADLESS=true
      - LOG_LEVEL=info
      - MASTER_KEY=${MASTER_KEY}
      - OLLAMA_ENDPOINT=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    volumes:
      # Persist data
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Config can be overridden
      - ./config:/app/config:ro
      # Optional: Mount .env file
      - ./.env:/app/.env:ro
    depends_on:
      - redis
      - ollama
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama (modelos locales)
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 16G
    networks:
      - mcp-network
    restart: unless-stopped

  # Redis (cache y queue)
  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mcp-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Prometheus (métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - mcp-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  ollama-data:
  redis-data:
  prometheus-data:

networks:
  mcp-network:
    driver: bridge
